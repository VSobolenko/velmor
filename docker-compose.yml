services:
  postgres:
    image: postgres:17-alpine
    container_name: velmor-postgres
    environment:
      POSTGRES_USER: velmor
      POSTGRES_PASSWORD: velmor
      POSTGRES_DB: velmor
    ports:
      - '5432:5432'
    volumes:
      - velmor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velmor -d velmor']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: velmor-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - velmor-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  velmor-postgres-data:
  velmor-redis-data:
